[package]
name = "unity-ipa-installer"
version = "0.2.1"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
idevice = { version = "=0.1.68", default-features = false, features = ["usbmuxd", "ring", "pair", "amfi", "afc", "installation_proxy"] }
isideload = "=0.5.2"
isideload-vfs = "0.0.1"
plist = "1.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "rustls-no-provider", "http2", "charset", "system-proxy"] }
reqwest-middleware = "0.5"
rootcause = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5"
urlencoding = "2.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
strip = "symbols"
